[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bytecross"
dynamic = ["version"]
description = "The byte crossover of activation and KV-cache sparsity in LLM decoding"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jungseob Lee" }]
keywords = ["llm-inference", "activation-sparsity", "kv-cache", "decoding", "memory-bandwidth"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The byte account and the analyses of logged runs need numpy at most, so they run on any laptop.
# The timing and quality harness comes with the harness extra, plus flash-attn and a TEAL checkout.
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
harness = ["torch==2.4.0", "transformers>=4.43", "datasets", "safetensors", "msgspec", "scipy"]
test = ["pytest>=8"]

[project.scripts]
bytecross = "bytecross.cli:main"

[project.urls]
Homepage = "https://github.com/js-lee-AI/bytecross"
Issues = "https://github.com/js-lee-AI/bytecross/issues"

[tool.setuptools.dynamic]
version = { attr = "bytecross.__version__" }

[tool.setuptools.packages.find]
include = ["bytecross*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs the harness extra, torch and a TEAL checkout"]
addopts = "-m 'not gpu'"
